<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adrien Halnaut — CV</title>
<meta name="description" content="Docteur en informatique et ingénieur logiciel, spécialisé en visualisation de réseaux de neurones et IA explicable." />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="nav-inner">
    <a class="brand" href="#hero">Adrien Halnaut</a>
    <nav class="nav-links" id="nav-links"></nav>
    <div class="nav-controls">
      <button class="icon-btn lang-btn" id="lang-toggle" aria-label="Switch language">EN</button>
      <button class="icon-btn" id="theme-toggle" aria-label="Changer de thème">🌓</button>
      <button class="icon-btn" id="nav-toggle" aria-label="Ouvrir le menu">☰</button>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <div class="hero-avatar" id="hero-avatar"></div>
    <div class="hero-text">
      <span class="eyebrow" id="hero-eyebrow"></span>
      <h1 id="hero-name"></h1>
      <p class="hero-role" id="hero-title"></p>
      <p class="hero-tagline" id="hero-tagline"></p>
      <div class="hero-meta">
        <span id="hero-location"></span>
      </div>
    </div>
  </section>

  <div id="main-content"></div>

  <section class="contact-section" id="contact">
    <span class="eyebrow">Contact</span>
    <h2 id="contact-title"></h2>
    <p class="section-note" id="contact-subtitle"></p>
    <div class="contact-links">
      <a id="contact-email" href="#"></a>
      <a id="contact-phone" href="#"></a>
      <a id="contact-github" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>© <span id="year"></span> <span id="footer-name"></span> — <span id="footer-tagline"></span></p>
</footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
